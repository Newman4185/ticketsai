<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptTicketAI — Support Assistant</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #151b32;
      --panel-2: #1d2543;
      --accent: #6ea8fe;
      --accent-2: #8b7bff;
      --text: #e8ecf6;
      --muted: #9aa3bd;
      --user: #243056;
      --line: #2a3357;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 70% -10%, #1b2550, transparent),
                  linear-gradient(180deg, #0b1020, #0a0e1c);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 40px; height: 40px; display: block; flex: 0 0 auto;
      filter: drop-shadow(0 4px 12px rgba(110, 168, 254, .35));
    }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    main {
      flex: 1;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }
    #log {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 16px;
    }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--user); border: 1px solid var(--line); }
    .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
    .msg.bot.thinking { color: var(--muted); font-style: italic; }
    .empty { color: var(--muted); text-align: center; margin-top: 40px; }
    form {
      display: flex; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line);
      position: sticky; bottom: 0; background: linear-gradient(180deg, transparent, var(--bg) 30%);
    }
    textarea {
      flex: 1; resize: none; min-height: 52px; max-height: 160px;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
      font: inherit; outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #0b1020; font-weight: 700; border: 0; border-radius: 12px;
      padding: 0 22px; cursor: pointer; font-size: 15px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 48 48" role="img" aria-label="PromptTicketAI logo" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ptg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#6ea8fe" />
          <stop offset="1" stop-color="#8b7bff" />
        </linearGradient>
      </defs>
      <!-- Ticket body with rounded corners and side notches -->
      <path fill="url(#ptg)" d="M10 7h28a5 5 0 0 1 5 5v6.5a5.5 5.5 0 0 0 0 11V36a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5v-6.5a5.5 5.5 0 0 0 0-11V12a5 5 0 0 1 5-5Z" />
      <!-- Perforation line -->
      <line x1="24" y1="11" x2="24" y2="37" stroke="#0b1020" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3.4" opacity=".55" />
      <!-- Prompt chevron + caret on the right (the "AI prompt") -->
      <path d="M30 19l4 5-4 5" fill="none" stroke="#0b1020" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="37" y1="29" x2="40" y2="29" stroke="#0b1020" stroke-width="2.6" stroke-linecap="round" />
      <!-- Spark on the left (the "ticket") -->
      <path d="M15 16.5l1.4 3.6 3.6 1.4-3.6 1.4L15 26.5l-1.4-3.6L10 21.5l3.6-1.4z" fill="#0b1020" />
    </svg>
    <div>
      <h1>PromptTicketAI</h1>
      <p>Your AI support assistant, powered by Netlify AI Gateway</p>
    </div>
  </header>
  <main>
    <div id="log">
      <div class="empty" id="empty">Ask a question or describe a support ticket to get started.</div>
    </div>
    <form id="form">
      <textarea id="input" placeholder="Describe your issue or ask a question…" autocomplete="off"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
  </main>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const empty = document.getElementById('empty');

    function addMessage(text, role) {
      if (empty) empty.remove();
      const el = document.createElement('div');
      el.className = 'msg ' + role;
      el.textContent = text;
      log.appendChild(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return el;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      addMessage(prompt, 'user');
      input.value = '';
      send.disabled = true;

      const thinking = addMessage('Thinking…', 'bot thinking');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        thinking.classList.remove('thinking');
        thinking.textContent = res.ok
          ? (data.response || 'No response received.')
          : (data.error || 'Something went wrong.');
      } catch (err) {
        thinking.classList.remove('thinking');
        thinking.textContent = 'Network error. Please try again.';
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
